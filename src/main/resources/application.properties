spring.application.name=projeto-rpg

# Carrega as variaveis do arquivo .env (modelo em .env.template)
spring.config.import=optional:file:.env[.properties]

# Banco de dados MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O schema vem do script SQL. As entidades JPA nao devem criar ou alterar o schema
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Docker Compose
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yaml
spring.docker.compose.lifecycle-management=start-and-stop
spring.docker.compose.readiness.timeout=3m

# JSON: omite campos nulos (entidades relacionadas voltam apenas com o id)
spring.jackson.default-property-inclusion=non_null
